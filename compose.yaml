services:
  postgres:
    image: postgres:17
    container_name: corebank-db
    environment:
      POSTGRES_DB: corebank
      POSTGRES_USER: corebank
      POSTGRES_PASSWORD: corebank
    ports:
      - "5433:5432"
    volumes:
      - corebank-data:/var/lib/postgresql/data
volumes:
  corebank-data: